# `docker compose up -d db`    PostgreSQL only, for running the backend from your shell.
#
# It listens on 5433, not 5432, so it can run next to another project's database.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: scout
      POSTGRES_DB: tender_scout
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout -d tender_scout"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:

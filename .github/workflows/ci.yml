name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: scout
          POSTGRES_PASSWORD: scout
          POSTGRES_DB: tender_scout
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scout -d tender_scout"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TS_DATABASE_URL: postgresql+asyncpg://scout:scout@localhost:5432/tender_scout
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run alembic upgrade head
      # CI=true makes the tests that need PostgreSQL fail, not skip, without it.
      # No test calls the Baza Konkurencyjności: they replay recorded answers.
      - run: uv run pytest

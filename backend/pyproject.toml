[project]
name = "tender-scout"
version = "0.1.0"
description = "Reads requests for quotation and says what they require"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    # Windows and slim containers ship no IANA database; zoneinfo falls back to this.
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tender_scout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a running PostgreSQL (skipped locally when unreachable, required in CI)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PT", "DTZ", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]
mypy_path = "src"
